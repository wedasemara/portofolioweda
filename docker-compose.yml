x-app-build: &app-build
  image: portofolioweda-app
  build:
    context: .
    target: app

x-app-environment: &app-environment
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?}"
  APP_URL: "${APP_URL:?}"
  DB_CONNECTION: "mysql"
  DB_HOST: "db"
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:-portofolio_app}"
  DB_USERNAME: "laravel"
  DB_PASSWORD: "${DB_PASSWORD:?}"
  LOG_CHANNEL: "stderr"

services:
  db:
    image: docker.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-portofolio_app}"
      MYSQL_USER: "laravel"
      MYSQL_PASSWORD: "${DB_PASSWORD:?}"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    <<: *app-build
    restart: "no"
    env_file:
      - .env
    command:
      - sh
      - -c
      - "php artisan migrate --force --no-interaction && php artisan db:seed --class=CmsSeeder --force --no-interaction && php artisan cms:user --if-missing --no-interaction"
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-build
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "9000"

  queue:
    <<: *app-build
    restart: unless-stopped
    env_file:
      - .env
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=90", "--sleep=3"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: portofolioweda-web
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db-data:
